<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 160 500 205" width="100%" height="100%">
  <defs>
    <!-- Nostr Station palette: purple / violet / neon cyan -->

    <!-- Neon cyan glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Headset body gradient (the dark purples of the room's chairs) -->
    <linearGradient id="headsetBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d2c63" />
      <stop offset="50%" stop-color="#2a1a4a" />
      <stop offset="100%" stop-color="#190e30" />
    </linearGradient>

    <!-- Neon frame gradient (the room's cyan / blue) -->
    <linearGradient id="cyanNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#0099ff" />
    </linearGradient>

    <!-- Dark, clean visor glass gradient -->
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1136" />
      <stop offset="50%" stop-color="#110924" />
      <stop offset="100%" stop-color="#070310" />
    </linearGradient>

    <!-- Soft glass reflection -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g>
    <!-- Face cushion (behind the goggles) -->
    <path d="M 190 190 C 330 175 470 175 610 190 C 630 270 610 330 570 340 C 460 360 340 360 230 340 C 170 330 170 270 190 190 Z"
          fill="#130924" stroke="#2c1a4d" stroke-width="4" />

    <!-- ================= HEADSET BODY ================= -->
    <!-- Ergonomic, rounded shape -->
    <path d="M 200 185
             C 310 170, 490 170, 600 185
             C 630 190, 640 230, 630 280
             C 620 330, 560 345, 480 345
             C 430 345, 420 325, 400 325
             C 380 325, 370 345, 320 345
             C 240 345, 180 330, 170 280
             C 160 230, 170 190, 200 185 Z"
          fill="url(#headsetBody)" stroke="#523a80" stroke-width="3" />

    <!-- Neon cyan outline (matches the room's chairs and walls) -->
    <path d="M 205 190
             C 310 177, 490 177, 595 190
             C 620 195, 630 230, 622 275
             C 613 320, 555 338, 478 338
             C 430 338, 418 318, 400 318
             C 382 318, 370 338, 322 338
             C 245 338, 187 320, 178 275
             C 170 230, 180 195, 205 190 Z"
          fill="none" stroke="url(#cyanNeonGrad)" stroke-width="5" filter="url(#cyanGlow)" />

    <!-- ================= VISOR ================= -->
    <g>
      <!-- Centred dark glass visor -->
      <path id="visorWindow" d="M 220 202
               C 310 192, 490 192, 580 202
               C 600 210, 608 238, 600 270
               C 590 308, 545 325, 475 325
               C 430 325, 415 308, 400 308
               C 385 308, 370 325, 325 325
               C 255 325, 210 308, 200 270
               C 192 238, 200 210, 220 202 Z"
            fill="url(#lensGlass)" stroke="#22113b" stroke-width="4" />

      <!-- Curved reflection on the glass -->
      <path d="M 220 202 C 310 192, 490 192, 580 202 C 595 208, 600 220, 598 235 C 480 215, 320 215, 202 238 C 200 220, 205 208, 220 202 Z"
            fill="url(#glassReflection)" />
    </g>

    <!-- VR sensor / camera details on the edges -->
    <circle cx="215" cy="215" r="5" fill="#0d0517" stroke="#00f3ff" stroke-width="1.5" />
    <circle cx="585" cy="215" r="5" fill="#0d0517" stroke="#00f3ff" stroke-width="1.5" />

    <circle cx="225" cy="305" r="5" fill="#0d0517" stroke="#00f3ff" stroke-width="1.5" />
    <circle cx="575" cy="305" r="5" fill="#0d0517" stroke="#00f3ff" stroke-width="1.5" />
  </g>
</svg>
