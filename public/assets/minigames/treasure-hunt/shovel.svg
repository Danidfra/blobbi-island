<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="100%" height="100%">
  <defs>
    <!-- Estilo de Contorno Global Cartoon -->
    <style>
      .dark-stroke { stroke: #18222D; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .medium-stroke { stroke: #18222D; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    </style>

    <!-- Gradientes -->
    <!-- Lâmina Principal e Soquete (Verde Água / Teal) -->
    <linearGradient id="teal-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#76DBCB"/>
      <stop offset="35%" stop-color="#50C7B5"/>
      <stop offset="100%" stop-color="#2B9182"/>
    </linearGradient>

    <linearGradient id="teal-inner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4CBCAE"/>
      <stop offset="60%" stop-color="#349C8F"/>
      <stop offset="100%" stop-color="#237267"/>
    </linearGradient>

    <!-- Cabo de Madeira -->
    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="40%" stop-color="#FCEECB"/>
      <stop offset="100%" stop-color="#E2CA99"/>
    </linearGradient>

    <!-- Pegador Amarelo -->
    <linearGradient id="yellow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE773"/>
      <stop offset="50%" stop-color="#F9BE3B"/>
      <stop offset="100%" stop-color="#D9911C"/>
    </linearGradient>

    <!-- Detalhes Coral / Laranja -->
    <linearGradient id="coral-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8A75"/>
      <stop offset="50%" stop-color="#EE5E48"/>
      <stop offset="100%" stop-color="#C23E2A"/>
    </linearGradient>
  </defs>

  <g id="shovel-straight">
    <!-- 1. HASTE DE MADEIRA (CABO CENTRAL) -->
    <rect x="135" y="270" width="30" height="150" rx="4" class="dark-stroke" fill="url(#wood-grad)"/>

    <!-- 2. LÂMINA DA PÁ (VERDE-ÁGUA) -->
    <!-- Borda/Fundo Externo -->
    <path class="dark-stroke" fill="url(#teal-light)" d="
      M 150 40 
      C 220 40, 240 100, 240 170 
      C 240 230, 225 260, 190 260 
      L 110 260 
      C 75 260, 60 230, 60 170 
      C 60 100, 80 40, 150 40 Z" />

    <!-- Recuo Interno (Concavidade da Pá) -->
    <path class="medium-stroke" fill="url(#teal-inner)" d="
      M 150 55 
      C 205 55, 222 105, 222 165 
      C 222 215, 210 242, 182 242 
      L 118 242 
      C 90 242, 78 215, 78 165 
      C 78 105, 95 55, 150 55 Z" />

    <!-- Brilho/Highlight na Lâmina -->
    <path d="M 85 160 C 85 105, 100 65, 140 58 C 105 65, 95 105, 95 160 C 95 200, 102 230, 115 238 C 98 230, 85 200, 85 160 Z" fill="#A4F3E7" opacity="0.6" />

    <!-- 3. SOQUETE DE ENCAIXE (ONDE O CABO ENTRA NA LÂMINA) -->
    <path class="dark-stroke" fill="url(#teal-light)" d="
      M 130 300 
      L 130 200 
      C 130 170, 170 170, 170 200 
      L 170 300 
      C 170 310, 130 310, 130 300 Z" />
    
    <!-- Sombra e Brilho do Soquete -->
    <path d="M 135 200 C 135 180, 150 178, 150 200 L 150 298 L 135 298 Z" fill="#A4F3E7" opacity="0.5" />
    <path d="M 155 200 C 155 180, 165 180, 165 200 L 165 298 L 155 298 Z" fill="#18222D" opacity="0.25" />

    <!-- 4. PEGADOR SUPERIOR (D-HANDLE AMRELO E CORAL) -->
    <!-- Anel Amarelo Principal -->
    <path class="dark-stroke" fill="url(#yellow-grad)" d="
      M 90 490 
      C 80 430, 220 430, 210 490 
      C 205 525, 195 540, 175 540 
      L 125 540 
      C 105 540, 95 525, 90 490 Z" />

    <!-- Furo do Pegador D -->
    <path class="dark-stroke" fill="#FFFFFF" d="
      M 115 480 
      C 110 450, 190 450, 185 480 
      C 182 505, 175 510, 150 510 
      C 125 510, 118 505, 115 480 Z" />

    <!-- Empunhadura Coral Inferior -->
    <rect x="120" y="512" width="60" height="26" rx="10" class="dark-stroke" fill="url(#coral-grad)" />
    <!-- Brilho na Empunhadura Coral -->
    <path d="M 125 516 L 175 516 C 178 516, 178 522, 175 522 L 125 522 C 122 522, 122 516, 125 516 Z" fill="#FFB7AB" opacity="0.8" />

    <!-- Conector Coral Superior (Base do Pegador) -->
    <rect x="123" y="402" width="54" height="34" rx="12" class="dark-stroke" fill="url(#coral-grad)" />
    <!-- Brilho no Conector -->
    <path d="M 128 406 L 172 406 C 175 406, 175 412, 172 412 L 128 412 C 125 412, 125 406, 128 406 Z" fill="#FFB7AB" opacity="0.8" />
  </g>
</svg>
