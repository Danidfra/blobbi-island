# Keep this tag in step with .nvmrc: GitLab cannot read a version file for the
# job image. Node 24 LTS is required: planck (the Pool physics engine) declares
# engines.node ">=24.0".
image: node:24.18.0

default:
  interruptible: true
  timeout: 1 minute

stages:
  - validate
  - deploy

# The full check, run on every branch.
#
# The Blobbi renderer is consumed as `@blobbi/renderer`, an npm `file:`
# dependency on the sibling blobbi-kit checkout (`../blobbi-kit`) until the
# package is published. That checkout must be present and built (`npm run
# build` there) before `npm ci` here can link a working package; the
# `renderer-boundary` test names that requirement explicitly when it is unmet.
#
# Steps are spelled out rather than deferred to `npm test` so a red pipeline
# names the failing check in the job list. They are the same steps in the same
# order as `npm test`. Nothing here publishes.
validate:
  stage: validate
  # The default 1-minute budget covers a build, not a full suite (~3.5k tests
  # across the app, the package and the consumer fixture) on a cold install.
  timeout: 15 minutes
  script:
    # The renderer is a `file:` dependency on the sibling repository. Build it
    # first so the symlinked package has its dist/ when the app is checked.
    - git clone --depth 1 https://github.com/Danidfra/blobbi-kit.git ../blobbi-kit
    - (cd ../blobbi-kit && npm ci && npm run build)
    # Clean, lockfile-exact install of the app.
    - npm ci
    # 1. App TypeScript.
    - npx tsc -p tsconfig.app.json --noEmit
    # 2. ESLint.
    - npx eslint
    # 3. Every Vitest suite, including the Island-side renderer boundary tests.
    - npx vitest run
    # 4. App production build.
    - npx vite build

pages:
  stage: deploy
  script:
    - npm run build
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  only:
    variables:
      - $CI_DEFAULT_BRANCH == $CI_COMMIT_REF_NAME
