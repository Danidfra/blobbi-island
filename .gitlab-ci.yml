# Keep this tag in step with .nvmrc: GitLab cannot read a version file for the
# job image. Node 24 LTS is required: planck (the Pool physics engine) declares
# engines.node ">=24.0".
image: node:24.18.0

default:
  interruptible: true
  timeout: 1 minute

stages:
  - validate
  - deploy

# The full check, run on every branch.
#
# This repository is an npm workspace root: the app in `src/` plus the local,
# UNPUBLISHED `@blobbi/react` renderer package and its test-only consumer
# fixture under `packages/`. `npm ci` installs and links all three from the
# lockfile, so the package is validated the way a consumer would get it rather
# than the way a developer's stale `node_modules` happens to look.
#
# Steps are spelled out rather than deferred to `npm test` so a red pipeline
# names the failing check in the job list. They are the same steps in the same
# order as `npm test`, plus the package build, which `npm test` does not run,
# because the app consumes the package from TypeScript source and never needs
# `dist/`. CI builds it anyway: the publishable artifact is the one thing local
# development never exercises, so it is exactly the thing that rots unnoticed.
#
# Nothing here publishes. `@blobbi/react` is `private: true`, `npm ci` does not
# run lifecycle publishing, and there is no `npm publish` in this pipeline.
validate:
  stage: validate
  # The default 1-minute budget covers a build, not a full suite (~3.5k tests
  # across the app, the package and the consumer fixture) on a cold install.
  timeout: 15 minutes
  script:
    # Clean, lockfile-exact install of the root app and both workspaces.
    - npm ci
    # 1. App TypeScript.
    - npx tsc -p tsconfig.app.json --noEmit
    # 2. Workspace typechecks, @blobbi/react and the consumer fixture. Each
    #    package typechecks standalone against its OWN tsconfig, which is what
    #    proves the package has no `@/` alias or host-config dependency.
    - npm run typecheck --workspaces --if-present
    # 3. ESLint (repo + packages; `packages/*/dist` is ignored).
    - npx eslint
    # 4. Every Vitest suite: app, package (purity / public API / CSS contract),
    #    and the external consumer fixture.
    - npx vitest run
    # 5. The @blobbi/react publishable build: ESM + declarations into dist/.
    #    Build only; never published.
    - npm run build:package
    # 6. App production build.
    - npx vite build

pages:
  stage: deploy
  script:
    - npm run build
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  only:
    variables:
      - $CI_DEFAULT_BRANCH == $CI_COMMIT_REF_NAME
