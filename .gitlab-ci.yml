# Keep this tag in step with .nvmrc — GitLab cannot read a version file for the
# job image. Node 24 LTS is required: planck (the Pool physics engine) declares
# engines.node ">=24.0".
image: node:24.18.0

default:
  interruptible: true
  timeout: 1 minute

stages:
  - build
  - deploy

build:
  stage: build
  script:
    - npm run build
  only:
    variables:
      - $CI_DEFAULT_BRANCH != $CI_COMMIT_REF_NAME

pages:
  stage: deploy
  script:
    - npm run build
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  only:
    variables:
      - $CI_DEFAULT_BRANCH == $CI_COMMIT_REF_NAME
