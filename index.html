<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blobbi Island - Virtual Pet Adventure</title>
    <meta name="description" content="A virtual pet adventure on the Nostr network. Care for your Blobbi companions and explore the magical Blobbi Island." />

    <!-- Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Blobbi Island - Virtual Pet Adventure" />
    <meta property="og:description" content="A virtual pet adventure on the Nostr network. Care for your Blobbi companions and explore the magical Blobbi Island." />

    <!-- PWA -->
    <!-- Matches the default theme's page colour (--island-page in Cozy Day). -->
    <meta name="theme-color" content="#FFF8EC" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS icons -->
    <link rel="apple-touch-icon" href="/icons/blobbi-island-icon-rounded-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/blobbi-island-icon-rounded-192.png" />

    <!-- Favicon -->
    <link rel="icon" href="/icons/blobbi-island-icon-192.png" type="image/png" sizes="192x192" />

    <!-- Preload disabled: enable only if the island map becomes part of the first paint.
    <link rel="preload" href="/assets/world/map/blobbi-island.png" as="image" type="image/png" />
    -->

    <!--
      CSP

      The theater embeds YouTube through the official IFrame Player API, which
      needs exactly two additions; both exact hosts, no wildcards:

      * script-src https://www.youtube.com, `/iframe_api` itself, which the
        theater injects into this page, plus the widget bundle it then pulls from
        `/s/player/<hash>/www-widgetapi.vflset/www-widgetapi.js`.
      * script-src https://s.ytimg.com: the legacy host that same bundle is
        still served from for some clients (`/yts/jsbin/www-widgetapi-*.js`).

      Nothing else is required. A cross-origin iframe runs under its OWN policy,
      so the video's connections, images and media streams are governed by
      youtube.com's CSP and not by this one, `connect-src`, `img-src` and
      `media-src` are deliberately untouched.

      `frame-src` is TIGHTENED here rather than widened: it was `'self' https:`,
      which permitted framing any HTTPS origin, and the theater embed is the only
      iframe in the app.
    -->
    <meta http-equiv="content-security-policy" content="
      default-src 'none';
      script-src 'self' https://www.youtube.com https://s.ytimg.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com;
      font-src 'self' data: https://fonts.gstatic.com;
      base-uri 'self';
      manifest-src 'self';
      connect-src 'self' blob: data: https: ws: wss:;
      img-src 'self' data: blob: https:;
      media-src 'self' https:;
    ">

    <!-- Perf -->
    <link rel="dns-prefetch" href="//relay.primal.net">
    <link rel="preconnect" href="wss://relay.primal.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!--
      Theme, applied before first paint.

      BLOCKING on purpose (no `defer`, no `type="module"`): it writes the active
      palette onto <html> and paints the boot screen below, and both must happen
      before the browser paints anything, or a player on a non-default theme
      sees the default island flash first. It is a handful of property writes on
      an element that already exists, so the parser stall is negligible.

      It is also best-effort: AppProvider re-applies the palette
      authoritatively on mount. See the file header for why the palettes are
      duplicated there and what guards the duplication.
    -->
    <script src="/island-theme.js"></script>
  </head>
  <body>
    <div id="root">
      <!--
        Pre-React loading screen.

        Its colours are the theme's, written by /island-theme.js above (it looks
        for `id="island-boot"` and `[data-boot-spinner]`). The literals inline
        here are the default theme's, so the markup is still correct if that
        script never runs. React replaces this whole subtree on mount.
      -->
      <div id="island-boot" style="min-height: 100vh; background: hsl(38 100% 96%); color: hsl(31 24% 34%); display: flex; align-items: center; justify-content: center; font-family: Comfortaa, system-ui, -apple-system, sans-serif;">
        <div style="text-align: center;">
          <div data-boot-spinner style="width: 32px; height: 32px; border: 3px solid hsl(27 40% 54% / 0.25); border-top-color: hsl(197 78% 63%); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
          <p style="margin: 0; font-size: 14px;">Loading Blobbi Island...</p>
        </div>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
          [data-boot-spinner] { animation: none; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
