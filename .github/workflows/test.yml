name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        # .nvmrc is the single source of truth for the Node line (24 LTS), so CI
        # and a contributor's `nvm use` can never drift apart.
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Clean install dependencies
        run: |
          rm -rf node_modules
          npm ci
          
      - name: Run tests
        run: npm run test
